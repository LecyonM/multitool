[workspace]
resolver = "2"
members = ["crates/core", "crates/utilities", "src-tauri"]
# `cargo test` à la racine ne compile que le noyau et les utilitaires :
# pas besoin des dépendances système de Tauri pour tester la logique.
default-members = ["crates/core", "crates/utilities"]

[workspace.package]
version = "0.1.1"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
