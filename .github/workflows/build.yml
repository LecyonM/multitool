name: Compilation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests du noyau et des utilitaires
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  build:
    name: Compilation ${{ matrix.name }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        # Windows en premier. Pour désactiver une plateforme, supprimer son bloc.
        include:
          - name: windows
            os: windows-latest
            # Un seul installateur .exe (assistant en français), pas de .msi.
            args: "--bundles nsis"
            rust_targets: ""
          - name: linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: macos
            os: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    # Nécessaire pour joindre les fichiers à une version GitHub (étape finale).
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Dépendances système (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Compilation de l'application
        run: npm run build -- ${{ matrix.args }}

      # Tous les installateurs sont copiés dans un seul dossier à plat : le zip téléchargé
      # contient directement le fichier, sans sous-dossiers (release/bundle/nsis/…).
      - name: Rassembler les installateurs
        shell: bash
        run: |
          mkdir dist
          find target -path '*/bundle/*' \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' \) -exec cp {} dist/ \;
          ls -l dist

      - name: Archivage des fichiers produits
        uses: actions/upload-artifact@v4
        with:
          name: multitool-${{ matrix.name }}
          if-no-files-found: error
          path: dist/*

      # Quand on publie une étiquette (ex. v0.1.0), les installateurs sont joints à une
      # version GitHub : un lien de téléchargement direct, sans passer par les artefacts.
      - name: Joindre les fichiers à la version GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
